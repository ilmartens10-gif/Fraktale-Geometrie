<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fraktale Geometrie – Presentation Startseite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root{
  --bg:#000000;
  --card-bg:rgba(28,28,30,.6);
  --card-border:rgba(255,255,255,.12);
  --text-main:#f5f5f7;
  --text-muted:#86868b;
  --accent-blue:#0A84FF;
  --accent-cyan:#64D2FF;
  --accent-purple:#BF5AF2;
  --accent-gold:#FFD60A;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;
  background:var(--bg); color:var(--text-main);
  min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
}

/* ─── Ambient glows ─── */
.ambient-glow-1{
  position:fixed; top:-160px; left:50%; transform:translateX(-50%);
  width:800px; height:520px;
  background:radial-gradient(circle, rgba(191,90,242,.2) 0%, rgba(0,0,0,0) 70%);
  pointer-events:none; z-index:0;
}
.ambient-glow-2{
  position:fixed; bottom:-220px; right:-120px;
  width:650px; height:650px;
  background:radial-gradient(circle, rgba(10,132,255,.18) 0%, rgba(0,0,0,0) 70%);
  pointer-events:none; z-index:0;
}

/* ─── Shared site header ─── */
.site-header{
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:14px 24px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; min-width:0; }
.brand-mark{
  width:30px; height:30px; border-radius:8px; flex-shrink:0;
  display:grid; place-items:center;
  background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));
  box-shadow:0 0 14px rgba(100,210,255,.3);
}
.brand-mark svg{ width:15px; height:15px; fill:#fff; }
.brand-name{ font-size:16px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; }
.site-nav{ display:flex; align-items:center; gap:4px; }
.site-nav-link{
  padding:7px 14px; border-radius:980px;
  font-size:13px; font-weight:500;
  color:var(--text-muted); text-decoration:none; white-space:nowrap;
  transition:background .15s,color .15s;
}
.site-nav-link:hover{ color:#fff; background:rgba(255,255,255,.08); }
.site-nav-link.active{ color:#fff; background:rgba(255,255,255,.12); border:1px solid var(--card-border); }
@media (max-width:560px){
  .brand-name{ display:none; }
  .site-nav-link{ padding:6px 10px; font-size:11.5px; }
}

/* ─── Hero ─── */
main{ flex:1; position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:80px 24px 64px; width:100%; }

.hero{ text-align:center; margin-bottom:76px; }
.page-tag{
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.12em;
  color:var(--accent-cyan); margin-bottom:14px;
}
h1{ font-size:clamp(38px,6vw,62px); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin-bottom:20px; }
.gradient-text{
  background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.hero-subtitle{
  font-size:19px; color:var(--text-muted); max-width:640px;
  margin:0 auto 36px; line-height:1.55;
}
.cta-group{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.btn{
  padding:13px 26px; border-radius:980px; font-size:15px; font-weight:600;
  text-decoration:none; display:inline-flex; align-items:center; gap:8px;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));
  color:#fff; box-shadow:0 4px 22px rgba(10,132,255,.35);
}
.btn-primary:hover{ transform:scale(1.03); box-shadow:0 6px 26px rgba(191,90,242,.45); }
.btn-secondary{
  background:rgba(255,255,255,.08); color:#fff; border:1px solid var(--card-border);
}
.btn-secondary:hover{ background:rgba(255,255,255,.15); }

/* ─── Principle cards ─── */
.section-label{
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.12em;
  color:var(--text-muted); text-align:center; margin-bottom:12px;
}
.section-title{
  font-size:clamp(24px,3.4vw,34px); font-weight:800; letter-spacing:-.02em;
  text-align:center; margin-bottom:44px;
}
.grid-cards{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px; margin-bottom:64px;
}
.card{
  background:var(--card-bg);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
  border:1px solid var(--card-border); border-radius:22px;
  padding:30px; transition:transform .2s ease, border-color .2s ease;
}
.card:hover{ transform:translateY(-4px); border-color:rgba(255,255,255,.25); }
.card-glyph{ font-size:28px; font-weight:800; margin-bottom:16px; }
.card-title{ font-size:19px; font-weight:700; margin-bottom:8px; color:#fff; }
.card-desc{ font-size:14.5px; color:var(--text-muted); line-height:1.6; }

/* ─── Formula showcase ─── */
.formula-box{
  background:linear-gradient(135deg, rgba(30,30,35,.8), rgba(15,15,20,.9));
  border:1px solid rgba(100,210,255,.2);
  border-radius:26px; padding:44px 32px; text-align:center;
}
.formula-tag{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-cyan); margin-bottom:14px; }
.formula-text{ font-size:clamp(28px,5vw,44px); font-weight:700; letter-spacing:1px; color:#fff; margin-bottom:14px; }
.formula-caption{ font-size:15px; color:var(--text-muted); max-width:520px; margin:0 auto; line-height:1.6; }

footer{
  border-top:1px solid rgba(255,255,255,.08); padding:28px;
  text-align:center; color:var(--text-muted); font-size:13px; z-index:1;
}
</style>
</head>
<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<header class="site-header">
  <a href="index.html" class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 16 16" fill-rule="evenodd"><path d="M8 2 L14 13.5 L2 13.5 Z M5 7.75 L11 7.75 L8 13.5 Z"/></svg>
    </span>
    <span class="brand-name">Fraktale Geometrie</span>
  </a>
</header>

<main>
  <section class="hero">
    <div class="page-tag">Schulprojekt 2026</div>
    <h1>Fraktale Geometrie.<br><span class="gradient-text">Präsentation.</span></h1>
    <p class="hero-subtitle">Wie bist du hier hingekommen?</p>
    <div class="cta-group">
      <a href="presentation/keynote.html" class="btn btn-primary">Keynote öffnen</a>
      <a href="https://github.com/ilmartens10-gif/Fraktale-Geometrie" target="_blank" rel="noreferrer noopener" class="btn btn-secondary">Auf GitHub ansehen</a>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 ilmartens10-gif &amp; KingDando8430</p>
</footer>

</body>
</html>
