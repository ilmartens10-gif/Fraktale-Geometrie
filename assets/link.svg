<svg xmlns="http://www.w3.org/2000/svg" width="620" height="120" viewBox="0 0 620 120">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F6F7"/>
    </linearGradient>

    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16"
        flood-color="#000000"
        flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Button -->
  <rect x="10" y="10" width="600" height="100" rx="30"
        fill="url(#glass)"
        stroke="#E5E5EA"
        stroke-width="1"
        filter="url(#shadow)"/>

  <!-- Glass highlight -->
  <path d="M40 18H580C594 18 604 28 604 42V48H16V42C16 28 26 18 40 18Z"
        fill="url(#shine)"/>

  <!-- Icon container -->
  <rect x="28" y="28" width="64" height="64" rx="20"
        fill="#FAFAFA"
        stroke="#ECECEC"/>

  <!-- Globe -->
  <g transform="translate(60 60)"
     fill="none"
     stroke="#1C1C1E"
     stroke-width="2.3"
     stroke-linecap="round">
  
      <circle r="17"/>
      <ellipse rx="7" ry="17"/>
      <line x1="-17" y1="0" x2="17" y2="0"/>
      <path d="M-14 -8H14"/>
      <path d="M-14 8H14"/>
  
  </g>

  <!-- Title -->
  <text x="115"
        y="54"
        font-family="SF Pro Display, Inter, Helvetica, Arial, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#1C1C1E">
      Fraktale Geometrie
  </text>

  <!-- Subtitle -->
  <text x="115"
        y="78"
        font-family="SF Pro Text, Inter, Helvetica, Arial, sans-serif"
        font-size="15"
        fill="#6E6E73">
      Webseite öffnen
  </text>

  <!-- Arrow circle -->
  <circle cx="560" cy="60" r="22"
          fill="#F5F5F7"
          stroke="#E5E5EA"/>

  <!-- Blue arrow -->
  <g transform="translate(560 60)"
     fill="none"
     stroke="#007AFF"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round">
      <line x1="-9" y1="0" x2="7" y2="0"/>
      <polyline points="-1,-8 7,0 -1,8"/>
  </g>
</svg>
